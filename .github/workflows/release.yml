name: Release

# Publishes a signed APK as a GitHub Release on every push to main.
# Share this link. It always downloads the newest version:
#   https://github.com/melhive/airx1/releases/latest/download/airx1.apk
#
# Every release is signed with the same key and gets a higher versionCode,
# so Android installs it as an update over the previous version.
# Required repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD (key alias: airx1)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL_URL: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
      MODEL_PATH: app/src/main/assets/hand_landmarker.task
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        # versionCode must always increase. v0.1.0 (code 1) and v0.2.0 (code 2) were
        # published by hand, so CI releases use run number + 2.
        run: |
          N=$((GITHUB_RUN_NUMBER + 2))
          echo "AIRX1_VERSION_CODE=$N" >> "$GITHUB_ENV"
          echo "AIRX1_VERSION_NAME=0.2.$N" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache hand model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: hand-model-${{ hashFiles('model.sha256') }}

      - name: Download and verify hand model
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          [ -f "$MODEL_PATH" ] || curl -fsSL --retry 3 -o "$MODEL_PATH" "$MODEL_URL"
          echo "$(cat model.sha256)  $MODEL_PATH" | sha256sum -c -

      - name: Check signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/airx1-release.jks"
          if [ -n "$KEYSTORE_B64" ] && echo "$KEYSTORE_B64" | base64 --decode > "$KS" 2>/dev/null \
             && keytool -list -keystore "$KS" -storepass:env KS_PASS -alias airx1 > /dev/null 2>&1; then
            echo "AIRX1_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$KS"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No usable signing key in secrets; skipping the release. Releases must be signed with the same key so updates install over older versions. See README → Release signing."
            echo "### Release skipped: signing secrets missing or invalid" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests
        if: steps.key.outputs.ready == 'true'
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build signed release APK
        if: steps.key.outputs.ready == 'true'
        env:
          AIRX1_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AIRX1_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # The alias is not secret; keeping it out of secrets avoids GitHub masking the word in logs.
          AIRX1_KEY_ALIAS: airx1
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/airx1-release.jks"

      - name: Verify signature and privacy
        if: steps.key.outputs.ready == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee verify.txt
          grep -q "Verifies" verify.txt
          "$BT/aapt2" dump permissions "$APK" | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then
            echo "::error::INTERNET permission found in APK; this breaks the privacy promise."
            exit 1
          fi
          cp "$APK" airx1.apk

      - name: Publish GitHub Release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${AIRX1_VERSION_NAME}"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## AirX1 ${AIRX1_VERSION_NAME}"
            echo
            echo "**Install / update:** open this link on your Android phone and install:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/airx1.apk"
            echo
            echo "Installs over the previous version (same signing key, versionCode ${AIRX1_VERSION_CODE}). Your settings are kept."
            echo
            echo "First install: if the AirX1 toggle in Accessibility settings is greyed out, open App info → ⋮ → **Allow restricted settings**, then turn it on."
            echo
            echo "### Changes"
            if [ -n "$PREV" ]; then git log --pretty='- %s' "$PREV..HEAD"; else git log --pretty='- %s' -n 20; fi
          } > notes.md
          gh release create "$TAG" airx1.apk --title "AirX1 ${AIRX1_VERSION_NAME}" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "### Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/airx1.apk" >> "$GITHUB_STEP_SUMMARY"
