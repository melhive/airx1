name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL_URL: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
      MODEL_PATH: app/src/main/assets/hand_landmarker.task
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache hand model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: hand-model-${{ hashFiles('model.sha256') }}

      - name: Download and verify hand model
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fsSL --retry 3 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$(cat model.sha256)  $MODEL_PATH" | sha256sum -c -

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Decode release keystore (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/airx1-release.jks"
            echo "AIRX1_KEYSTORE_PATH=$RUNNER_TEMP/airx1-release.jks" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets not set; building a DEBUG APK. Each debug build may need an uninstall before updating."
          fi

      - name: Build APK
        env:
          AIRX1_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AIRX1_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AIRX1_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = "release" ]; then
            gradle --no-daemon assembleRelease --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/$VARIANT/*.apk | head -1)
          OUT="airx1-$VARIANT-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Privacy check (no INTERNET permission)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump permissions "$APK_OUT" | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then
            echo "::error::INTERNET permission found in APK; this breaks the privacy promise."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airx1-apk
          path: ${{ env.APK_OUT }}
          if-no-files-found: error
