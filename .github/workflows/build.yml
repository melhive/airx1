name: Build APK (debug)

# Development builds: every push to a branch other than main, every pull request,
# or manual dispatch. Produces a DEBUG APK ("AirX1 Debug", com.melhive.airx1.debug)
# that installs next to the real app. Normal users should use the release link
# in the README instead (release.yml).

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL_URL: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
      MODEL_PATH: app/src/main/assets/hand_landmarker.task
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache hand model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: hand-model-${{ hashFiles('model.sha256') }}

      - name: Download and verify hand model
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fsSL --retry 3 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$(cat model.sha256)  $MODEL_PATH" | sha256sum -c -

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          OUT="airx1-debug-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Privacy check (no INTERNET permission)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump permissions "$APK_OUT" | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then
            echo "::error::INTERNET permission found in APK; this breaks the privacy promise."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airx1-apk
          path: ${{ env.APK_OUT }}
          if-no-files-found: error
